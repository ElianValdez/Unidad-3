<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CINE JSON</title>

<style>
body{
    background: black;
    color: white;
    font-family: Arial;
}

h1{
    text-align: center;
    color: yellow;
}

table{
    width: 100%;
    border-collapse: collapse;
}

th, td{
    padding: 10px;
    border-bottom: 1px solid red;
}
</style>
</head>

<body>

<h1>CINE (JSON)</h1>

<table id="tabla">
<thead>
<tr>
<th>ID</th>
<th>Título</th>
<th>Año</th>
<th>Director</th>
<th>Actores</th>
<th>Personajes</th>
<th>Acciones</th>
</tr>
</thead>

<tbody></tbody>
</table>

<script>
// 🔥 base JSON (puedes llenarla con formularios después)
let peliculas = JSON.parse(localStorage.getItem("cineDB")) || [];

const tabla = document.querySelector("#tabla tbody");

function render(){
    tabla.innerHTML = "";

    peliculas.forEach((p, index) => {
        tabla.innerHTML += `
        <tr>
            <td>${index + 1}</td>
            <td>${p.titulo}</td>
            <td>${p.anio}</td>
            <td>${p.director}</td>
            <td>${p.actores.join(", ")}</td>
            <td>${p.personajes.join(", ")}</td>
            <td>
                <button onclick="eliminar(${index})">❌</button>
            </td>
        </tr>
        `;
    });
}

function eliminar(index){
    peliculas.splice(index, 1);
    localStorage.setItem("cineDB", JSON.stringify(peliculas));
    render();
}

render();
</script>

</body>
</html>
